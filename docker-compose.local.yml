name: carrental-local

services:
  db:
    image: postgres:16-alpine
    container_name: carrental-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-carrental_os}
      POSTGRES_USER: ${DB_USERNAME:-carrental}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carrental_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - carrental-local-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-carrental} -d ${DB_DATABASE:-carrental_os}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: carrental-local-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - carrental-local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  carrental-local-db-data:
  carrental-local-redis-data:
